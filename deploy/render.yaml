services:
  - type: web
    name: mayacardio-cloud-service
    env: python
    buildCommand: "pip install -r requirements.txt && pip install -e ."
    startCommand: "uvicorn mayacardio.cloud_server:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: CLOUD_DB_PATH
        value: "mayacardio_cloud.db"
